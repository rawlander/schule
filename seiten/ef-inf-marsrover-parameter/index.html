<script>
(function(){
 var m=document.querySelector('meta[name="ablauf"]');if(!m||!/^\d{4}-\d{2}-\d{2}$/.test(m.content))return;
 var d=new Date(),p=function(n){return(n<10?'0':'')+n},heute=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
 var a=m.content.split('-'),txt=a[2]+'.'+a[1]+'.'+a[0];
 if(heute>m.content){document.documentElement.className+=' ka-abgelaufen';
  document.addEventListener('DOMContentLoaded',function(){var nl=(document.documentElement.lang||'').slice(0,2)==='nl';
   document.body.innerHTML='<main class="ka-weg"><h1>'+(nl?'Deze pagina is verlopen':'Diese Seite ist abgelaufen')+'</h1><p>'+
    (nl?'Ze was beschikbaar tot '+txt+'. Vraag je docent als je haar nog nodig hebt.':'Sie war bis zum '+txt+' verfügbar. Frag deine Lehrkraft, wenn du sie noch brauchst.')+'</p></main>';});}
 else document.addEventListener('DOMContentLoaded',function(){[].forEach.call(document.querySelectorAll('[data-ablauf-text]'),function(e){e.textContent=txt})});
})();
</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Caveat:wght@700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: Heft-Seite mit Kästchenraster. Kopfbereich mit Doodle, darunter fünf Stationen (Parameter, Rückgabe, Mission), eine Expert-Station und Labor-Aufgaben mit Testtabelle.
   Jede Station: Doodle + Merkzettel links/oben, Aufgabenkarten darunter. */
:root {
  --bg: #EDF1F7; --grid: #DCE3EF; --card: #FFFFFF; --card2: #F4F6FB; --fg: #16213A; --muted: #55627F;
  --line: #CAD3E3; --accent: #C2461E; --accent-ink: #FFFFFF; --accent-soft: #FBE4DA;
  --ok: #1B8A4B; --ok-soft: #DDF3E5; --bad: #C42F3F; --bad-soft: #FADDE1; --focus: #2563EB;
  --code-bg: #111B35; --code-fg: #E6EDFA; --c-kw: #FF9E7A; --c-str: #8FE3A8; --c-num: #8CC8FF; --c-com: #7C8BAE; --c-fn: #F3D88A;
  --ink: #1E293B; --ink-soft: #334155; --paper: #FFFFFF; --red-pen: #E63946;
  --hl-yellow: #FFE600; --hl-blue: #38BDF8; --hl-green: #4ADE80; --hl-pink: #F43F5E; --hl-orange: #FB923C;
  --hl-op: .72; --hl-blend: multiply;
  --f-head: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, 'Courier New', monospace;
  --f-note: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1527; --grid: #17223D; --card: #16203A; --card2: #1B2747; --fg: #E7ECF7; --muted: #9DAAC8;
    --line: #2C3B60; --accent: #FF8A5B; --accent-ink: #1B0E08; --accent-soft: #3A2319;
    --ok: #4ADE80; --ok-soft: #12362A; --bad: #FF7A86; --bad-soft: #3B1A22; --focus: #7DB1FF;
    --code-bg: #0A1122; --ink: #E2E8F0; --ink-soft: #B8C4DA; --paper: #1B2747; --red-pen: #FF6B77;
    --hl-op: .5; --hl-blend: normal; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1527; --grid: #17223D; --card: #16203A; --card2: #1B2747; --fg: #E7ECF7; --muted: #9DAAC8;
  --line: #2C3B60; --accent: #FF8A5B; --accent-ink: #1B0E08; --accent-soft: #3A2319;
  --ok: #4ADE80; --ok-soft: #12362A; --bad: #FF7A86; --bad-soft: #3B1A22; --focus: #7DB1FF;
  --code-bg: #0A1122; --ink: #E2E8F0; --ink-soft: #B8C4DA; --paper: #1B2747; --red-pen: #FF6B77;
  --hl-op: .5; --hl-blend: normal; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  color: var(--fg); font: 400 16px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
.wrap { max-width: 980px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-head); text-wrap: balance; margin: 0; line-height: 1.12; }
code, .mono { font-family: var(--f-mono); }
p { margin: 0 0 .6em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

/* Doodles */
.doodle { display: block; width: 100%; height: auto; overflow: visible; }
.ink-bold { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.ink-detail { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ink-fine { fill: none; stroke: var(--ink-soft); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.fill-paper { fill: var(--paper); stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.hl-yellow { fill: var(--hl-yellow); opacity: var(--hl-op); mix-blend-mode: var(--hl-blend); }
.hl-blue, .hl-cyan { fill: var(--hl-blue); opacity: var(--hl-op); mix-blend-mode: var(--hl-blend); }
.hl-green { fill: var(--hl-green); opacity: var(--hl-op); mix-blend-mode: var(--hl-blend); }
.hl-pink { fill: var(--hl-pink); opacity: calc(var(--hl-op) - .15); mix-blend-mode: var(--hl-blend); }
.hl-orange { fill: var(--hl-orange); opacity: var(--hl-op); mix-blend-mode: var(--hl-blend); }
.red-line { fill: none; stroke: var(--red-pen); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.red-line.thin { stroke-width: 2.5; }
.red-fill { fill: var(--red-pen); }
.mark-x { fill: none; stroke: #22A83A; stroke-width: 5; stroke-linecap: round; }
.note { font: 700 16px var(--f-note); fill: var(--red-pen); }
.ink-text { fill: var(--ink); }
.mono { font: 600 9px var(--f-mono); fill: var(--ink); }
.star-shape { fill: #FFE600; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }

/* Kopf */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 980px; margin: 0 auto; display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; scrollbar-width: thin; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card2); color: var(--fg); text-decoration: none; font: 600 13px var(--f-body); white-space: nowrap;
}
.chip:hover { border-color: var(--accent); }
.chip .cnt { font: 500 12px var(--f-mono); color: var(--muted); }
.chip.all { background: var(--ok-soft); border-color: var(--ok); }
.chip.all .cnt { color: var(--ok); }
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: center; padding: 36px 0 24px; }
.hero h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: -.02em; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 58%, color-mix(in srgb, var(--hl-yellow) 70%, transparent) 58% 92%, transparent 92%); padding: 0 .1em; }
.hero .lead { margin: 14px 0 18px; color: var(--muted); max-width: 46ch; font-size: 1.05rem; }
.kicker { font: 600 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.progress { display: grid; gap: 6px; max-width: 420px; }
.bar { height: 10px; border-radius: 99px; background: var(--card2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s ease; }
.progress .lbl { font: 500 13px var(--f-mono); color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }

/* Stationen */
.station { padding: 34px 0 6px; scroll-margin-top: 64px; }
.st-head { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 22px; align-items: center; margin-bottom: 18px; }
.st-head h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -.01em; }
.merke {
  margin-top: 12px; padding: 12px 16px; border-radius: 4px 14px 14px 14px; background: var(--card);
  border: 1px solid var(--line); box-shadow: 4px 4px 0 color-mix(in srgb, var(--hl-yellow) 55%, transparent); max-width: 62ch;
}
.merke b.tag { font: 700 13px var(--f-note); font-size: 19px; color: var(--red-pen); margin-right: 6px; }
.merke code, .act code { background: var(--card2); border: 1px solid var(--line); padding: 0 5px; border-radius: 5px; font-size: .88em; }
.st-sum { margin-left: auto; font: 500 12px var(--f-mono); color: var(--muted); }

.act { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; margin: 0 0 18px; position: relative; }
.act.done { border-color: var(--ok); }
.act-head { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 12px; }
.act-head h3 { font-size: 1.15rem; font-weight: 700; flex: 1 1 220px; min-width: 0; }
.act-head .type { flex: none; font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.act-head .okbadge { flex: none; display: none; font: 600 12px var(--f-mono); padding: 4px 9px; border-radius: 6px; background: var(--ok-soft); color: var(--ok); }
.act.done .okbadge { display: inline-block; }
.intro { color: var(--muted); margin: -4px 0 12px; font-size: .96rem; }
.act-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.fb { flex: 1 1 200px; min-height: 1.5em; font-weight: 500; min-width: 0; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); } .fb.info { color: var(--muted); }
.btn {
  font: 600 14px var(--f-body); border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); min-height: 40px;
}
.btn:hover { filter: brightness(1.06); } .btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Code */
pre.code, .codebox {
  margin: 0 0 12px; background: var(--code-bg); color: var(--code-fg); border-radius: 12px; padding: 14px 16px;
  font: 400 13.5px/1.7 var(--f-mono); overflow-x: auto; tab-size: 4; white-space: pre;
}
.c-kw { color: var(--c-kw); font-weight: 600; } .c-str { color: var(--c-str); } .c-num { color: var(--c-num); }
.c-com { color: var(--c-com); font-style: italic; } .c-fn { color: var(--c-fn); }

/* Zuordnung */
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 28px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.mi {
  display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 12px; border-radius: 12px; background: var(--card2);
  border: 2px solid var(--line); cursor: pointer; text-align: left; font: 500 15px var(--f-body); color: var(--fg); width: 100%;
}
.mi:hover { border-color: var(--accent); }
.mi.sel { border-color: var(--accent); background: var(--accent-soft); }
.mi.solved { cursor: default; border-color: var(--hc); background: color-mix(in srgb, var(--hc) 16%, var(--card)); }
.mi svg { flex: none; width: 46px; height: 46px; border-radius: 8px; }
.mi code { font-size: .92em; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

/* Gruppenzuordnung */
.pool, .bucket { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.pool { min-height: 56px; padding: 10px; border: 2px dashed var(--line); border-radius: 12px; margin-bottom: 12px; }
.buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.bwrap { border: 2px solid var(--line); border-radius: 14px; background: var(--card2); padding: 10px; cursor: pointer; min-width: 0; }
.bwrap.hover { border-color: var(--accent); background: var(--accent-soft); }
.bwrap h4 { margin: 0 0 8px; font: 700 15px var(--f-head); }
.bwrap h4 small { font: 400 13px var(--f-body); color: var(--muted); display: block; }
.bucket { min-height: 70px; }
.card {
  background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: grab; font: 500 13.5px var(--f-mono);
  color: var(--fg); text-align: left; max-width: 100%; overflow-wrap: anywhere;
}
.card:hover { border-color: var(--accent); }
.card.sel { border-color: var(--accent); background: var(--accent-soft); }
.card.wrong { border-color: var(--bad); background: var(--bad-soft); }
.card.right { border-color: var(--ok); background: var(--ok-soft); }

/* Lückentext */
.gaptext p { line-height: 2.1; }
.gaptext .codebox { line-height: 2.2; }
input.gap {
  font: 500 14px var(--f-mono); color: var(--fg); background: var(--card); border: 0; border-bottom: 2px solid var(--accent);
  border-radius: 6px 6px 0 0; padding: 2px 6px; margin: 0 2px; text-align: center; min-width: 3ch; max-width: 100%;
}
.codebox input.gap { background: #ffffff22; color: #FFFFFF; border-bottom-color: var(--c-kw); }
input.gap.ok { border-bottom-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
input.gap.bad { border-bottom-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
input.gap.shown { border-bottom-style: dashed; }
.codebox input.gap.ok { background: var(--ok-soft); color: var(--ok); }
.codebox input.gap.bad { background: var(--bad-soft); color: var(--bad); }

/* Reihenfolge */
.olist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.oitem { display: flex; align-items: center; gap: 8px; background: var(--code-bg); color: var(--code-fg); border: 2px solid transparent; border-radius: 10px; padding: 4px 8px 4px 14px; font: 400 14px var(--f-mono); }
.oitem .txt { flex: 1; white-space: pre; overflow-x: auto; min-width: 0; padding: 4px 0; }
.oitem.right { border-color: var(--ok); } .oitem.wrong { border-color: var(--bad); }
.oitem .mv { display: flex; flex-direction: column; gap: 2px; }
.mvb { background: #ffffff1f; color: var(--code-fg); border: 0; border-radius: 5px; width: 30px; height: 20px; cursor: pointer; font-size: 11px; line-height: 1; }
.mvb:hover { background: var(--accent); color: var(--accent-ink); }

/* Quiz */
.qprog { display: flex; gap: 5px; margin-bottom: 12px; }
.qprog i { flex: 1; height: 6px; border-radius: 4px; background: var(--line); }
.qprog i.cur { background: var(--accent); } .qprog i.ok { background: var(--ok); } .qprog i.bad { background: var(--bad); }
.q { font: 600 1.05rem var(--f-body); margin-bottom: 10px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--card2); border-radius: 12px; padding: 10px 14px; cursor: pointer; font: 500 15px var(--f-body); color: var(--fg); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); } .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.why { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: var(--card2); border-left: 4px solid var(--accent); }

/* Wahrheitstabelle */
.tt { border-collapse: separate; border-spacing: 0; width: 100%; max-width: 640px; font-size: 14px; }
.tt th, .tt td { border-bottom: 1px solid var(--line); padding: 8px 8px; text-align: center; }
.tt th { font: 600 12px var(--f-mono); color: var(--muted); vertical-align: bottom; }
.tt td.given { font: 600 13px var(--f-mono); }
.tv { min-width: 74px; border: 2px solid var(--line); border-radius: 8px; background: var(--card2); color: var(--muted); font: 600 13px var(--f-mono); cursor: pointer; padding: 6px 8px; }
.tv.t { color: var(--ok); border-color: var(--ok); } .tv.f { color: var(--bad); border-color: var(--bad); }
.tv.right { background: var(--ok-soft); } .tv.wrong { background: var(--bad-soft); }
.scroll-x { overflow-x: auto; }

/* Fehlersuche */
.lines { margin: 0 0 12px; background: var(--code-bg); border-radius: 12px; padding: 8px; display: grid; gap: 2px; font: 400 13.5px/1.6 var(--f-mono); color: var(--code-fg); overflow-x: auto; }
.ln { display: flex; gap: 12px; padding: 1px 8px; border-radius: 6px; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; text-align: left; width: 100%; white-space: pre; }
.ln:hover { background: #ffffff1a; }
.ln .no { color: var(--c-com); width: 1.6ch; text-align: right; flex: none; user-select: none; }
.ln.ok { background: color-mix(in srgb, var(--ok) 35%, transparent); } .ln.bad { background: color-mix(in srgb, var(--bad) 40%, transparent); }
.ln.eof { font-style: italic; color: var(--c-com); }
.errmsg { font: 500 13px var(--f-mono); background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }

/* Welt */
.world { display: block; width: 100%; height: auto; border-radius: 10px; border: 2px solid var(--line); background: #D98B5F; touch-action: manipulation; }
.world .rover { transition: transform .28s ease; }
.world.clickable .cell { fill: transparent; cursor: pointer; }
.world.clickable .cell:hover { fill: #ffffff40; }
.trace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.tcase { margin-bottom: 14px; }
.tcase .tl { font: 600 12px var(--f-mono); color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }

/* Labor */
.lab { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.lab .task { margin: 0 0 10px; }
.lab .concept { font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.editor { display: flex; background: var(--code-bg); border-radius: 12px; overflow: hidden; height: 300px; }
.gutter { flex: none; width: 3.2em; padding: 12px 8px 12px 0; text-align: right; color: var(--c-com); font: 400 13.5px/1.6 var(--f-mono); overflow: hidden; user-select: none; background: #ffffff0d; }
.gutter div { padding-right: 4px; border-right: 3px solid transparent; }
.gutter div.err { color: #fff; background: var(--bad); border-right-color: #fff; }
.gutter div.run { color: #fff; background: color-mix(in srgb, var(--accent) 70%, transparent); }
.editor textarea {
  flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--code-fg); padding: 12px 12px;
  font: 400 13.5px/1.6 var(--f-mono); white-space: pre; overflow: auto; tab-size: 4;
}
.editor:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.ctrl select { font: 500 13px var(--f-body); padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); color: var(--fg); }
.status { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--card2); border-left: 4px solid var(--line); min-height: 3.2em; font-weight: 500; }
.status.ok { border-left-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.status.bad { border-left-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.wtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.wtab { border: 2px solid var(--line); border-radius: 8px; background: var(--card2); color: var(--fg); font: 600 12px var(--f-mono); padding: 5px 10px; cursor: pointer; }
.wtab.sel { border-color: var(--accent); } .wtab.ok::after { content: " ✓"; color: var(--ok); } .wtab.bad::after { content: " ✗"; color: var(--bad); }
.hintbox { margin-top: 10px; display: grid; gap: 6px; }
.hintbox div { padding: 8px 12px; border-radius: 8px; background: var(--card2); border-left: 4px solid var(--hl-yellow); font-size: .94rem; }
details.sol { margin-top: 10px; } details.sol summary { cursor: pointer; font-weight: 600; }
.pick { margin-top: 6px; font-size: 13px; color: var(--muted); }

.save { margin-top: 30px; padding: 22px; border: 2px solid var(--line); border-radius: 18px; background: var(--card); scroll-margin-top: 64px; }
.save h2 { font-size: 1.6rem; font-weight: 800; }
.save .lead { color: var(--muted); max-width: 62ch; margin: 8px 0 16px; }
.fields { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.field label { display: block; font: 600 12px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.field input { width: 100%; font: 500 15px var(--f-body); padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--card2); color: var(--fg); min-height: 42px; }
.btn.big { min-height: 46px; padding: 11px 22px; font-size: 15px; }
.finish { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 20px; align-items: center; padding: 22px; border: 2px dashed var(--line); border-radius: 18px; margin-top: 30px; background: var(--card); }
.finish.on { border-style: solid; border-color: var(--ok); }
footer { margin-top: 36px; color: var(--muted); font-size: 13px; max-width: 70ch; }


.ctwrap { margin-top: 10px; overflow-x: auto; }
.ct { width: 100%; border-collapse: collapse; font-size: .88rem; }
.ct caption { text-align: left; font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 2px 0 6px; }
.ct th { text-align: left; font: 600 11px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 4px 8px; border-bottom: 2px solid var(--line); }
.ct td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: break-word; }
.ct tr.row { cursor: pointer; }
.ct tr.row:hover td { background: var(--card2); }
.ct tr.ok td:last-child { color: var(--ok); font-weight: 700; } .ct tr.bad td:last-child { color: var(--bad); font-weight: 700; }
.ct td.got { font-family: var(--f-mono); }
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; padding-top: 20px; }
  .st-head { grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: start; }
  .match { grid-template-columns: 1fr; }
  .trace, .lab { grid-template-columns: 1fr; }
  .finish { grid-template-columns: 90px minmax(0, 1fr); }
  .fields { grid-template-columns: 1fr; }
}

<script>
/* Mini-Java-Interpreter für den Marsrover (Methoden, Parameter, Rückgabewerte, if, while, for) */
(function (root) {
  'use strict';

  class JErr extends Error {
    constructor(line, msg) { super(msg); this.line = line; }
  }
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  const AUFTRAEGE = { fahre: 0, drehe: 1, setzeMarke: 0, entferneMarke: 0, analysiereGestein: 0 };
  const ANFRAGEN = { gesteinVorhanden: 0, markeVorhanden: 0, huegelVorhanden: 1 };
  const isBuiltin = n => n in AUFTRAEGE || n in ANFRAGEN;

  /* ---------- Tokenizer ---------- */
  function tokenize(src) {
    const toks = []; let i = 0, line = 1; const n = src.length;
    while (i < n) {
      const c = src[i];
      if (c === '\n') { line++; i++; continue; }
      if (/\s/.test(c)) { i++; continue; }
      if (c === '/' && src[i + 1] === '/') { while (i < n && src[i] !== '\n') i++; continue; }
      if (c === '/' && src[i + 1] === '*') {
        i += 2;
        while (i < n && !(src[i] === '*' && src[i + 1] === '/')) { if (src[i] === '\n') line++; i++; }
        i += 2; continue;
      }
      if (/[A-Za-z_ÄÖÜäöüß]/.test(c)) {
        let j = i; while (j < n && /[A-Za-z0-9_ÄÖÜäöüß]/.test(src[j])) j++;
        toks.push({ t: 'id', v: src.slice(i, j), line }); i = j; continue;
      }
      if (/[0-9]/.test(c)) {
        let j = i; while (j < n && /[0-9]/.test(src[j])) j++;
        toks.push({ t: 'num', v: +src.slice(i, j), line }); i = j; continue;
      }
      if (c === '"') {
        let j = i + 1; while (j < n && src[j] !== '"' && src[j] !== '\n') j++;
        if (src[j] !== '"') throw new JErr(line, 'Das Anführungszeichen " zum Schließen des Textes fehlt (unclosed string literal)');
        toks.push({ t: 'str', v: src.slice(i + 1, j), line }); i = j + 1; continue;
      }
      const two = src.substr(i, 2);
      if (['&&', '||', '==', '!=', '<=', '>=', '++', '--', '+=', '-='].includes(two)) { toks.push({ t: 'op', v: two, line }); i += 2; continue; }
      if ('(){};,!<>=+-*/%'.includes(c)) { toks.push({ t: 'op', v: c, line }); i++; continue; }
      throw new JErr(line, "Unbekanntes Zeichen '" + c + "'");
    }
    toks.push({ t: 'eof', v: '', line });
    return toks;
  }

  /* ---------- Parser ---------- */
  function makeParser(src) {
    const toks = tokenize(src); let p = 0;
    const cur = () => toks[p];
    const prevLine = () => (p > 0 ? toks[p - 1].line : toks[0].line);
    const isOp = v => cur().t === 'op' && cur().v === v;
    const isId = v => cur().t === 'id' && cur().v === v;
    const fail = (line, msg) => { throw new JErr(line, msg); };
    const EOFMSG = 'Dateiende erreicht: Es fehlt eine schließende Klammer (reached end of file while parsing)';

    function expect(v) {
      if (isOp(v)) return toks[p++];
      if (cur().t === 'eof') fail(cur().line, EOFMSG);
      const msgs = {
        ';': ["';' erwartet: Am Ende der Anweisung fehlt ein Semikolon", prevLine()],
        ')': ["')' erwartet: Eine Klammer wurde nicht geschlossen", cur().line],
        '(': ["'(' erwartet: Hinter dem Namen fehlen die runden Klammern", cur().line],
        '{': ["'{' erwartet: Hier beginnt ein Block mit einer geschweiften Klammer", cur().line],
        '}': ["'}' erwartet", cur().line],
        '=': ["'=' erwartet", cur().line]
      };
      const m = msgs[v] || ["'" + v + "' erwartet", cur().line];
      fail(m[1], m[0]);
    }
    function expectId(what) {
      const t = cur();
      if (t.t !== 'id') fail(t.line, what + ' erwartet');
      p++; return t;
    }

    function block() {
      const open = expect('{'); const body = [];
      while (!isOp('}')) {
        if (cur().t === 'eof') fail(cur().line, 'Dateiende erreicht: Die Klammer { aus Zeile ' + open.line + ' wird nie geschlossen, es fehlt ein } (reached end of file while parsing)');
        body.push(stmt());
      }
      const close = expect('}');
      return { k: 'block', body, line: open.line, endLine: close.line };
    }

    function update() {
      const nm = expectId('Name der Zählvariablen');
      const t = cur();
      if (t.t === 'op' && (t.v === '++' || t.v === '--')) { p++; return { k: 'assign', name: nm.v, op: t.v, e: null, line: t.line }; }
      if (t.t === 'op' && (t.v === '+=' || t.v === '-=' || t.v === '=')) { p++; return { k: 'assign', name: nm.v, op: t.v, e: expr(), line: t.line }; }
      fail(t.line, 'Im dritten Teil der for-Schleife fehlt die Veränderung der Zählvariablen (z. B. i++)');
    }

    function stmt() {
      const t = cur();
      if (t.t === 'op' && t.v === '{') return block();
      if (t.t === 'op' && t.v === ';') { p++; return { k: 'block', body: [], line: t.line }; }
      if (t.t === 'id') {
        if (t.v === 'if') {
          p++; expect('('); const c = expr(); expect(')'); const th = stmt(); let el = null;
          if (isId('else')) { p++; el = stmt(); }
          return { k: 'if', c, th, el, line: t.line };
        }
        if (t.v === 'else') fail(t.line, "'else' ohne passendes 'if' (illegal start of expression)");
        if (t.v === 'while') {
          p++; expect('('); const c = expr(); expect(')'); const body = stmt();
          return { k: 'while', c, body, line: t.line };
        }
        if (t.v === 'for') {
          p++; expect('(');
          if (!isId('int')) fail(cur().line, "Die Zählvariable wird mit 'int' deklariert, z. B. for (int i = 0; ...)");
          p++; const nm = expectId('Name der Zählvariablen'); expect('=');
          const init = expr(); expect(';'); const c = expr(); expect(';');
          const upd = update(); expect(')'); const body = stmt();
          return { k: 'for', name: nm.v, init, c, upd, body, line: t.line };
        }
        if (t.v === 'return') {
          p++; let e = null;
          if (!isOp(';')) e = expr();
          expect(';');
          return { k: 'return', e, line: t.line };
        }
        if (t.v === 'int' || t.v === 'String' || t.v === 'boolean') {
          p++; const nm = expectId('Name der Variablen'); let e = null;
          if (isOp('=')) { p++; e = expr(); }
          expect(';');
          return { k: 'decl', type: t.v, name: nm.v, e, line: t.line };
        }
        const nx = toks[p + 1];
        if (nx.t === 'op' && nx.v === '(') { const e = callExpr(); expect(';'); return { k: 'expr', e, line: t.line }; }
        if (nx.t === 'op' && ['=', '++', '--', '+=', '-='].includes(nx.v)) {
          p += 2;
          const e = (nx.v === '++' || nx.v === '--') ? null : expr();
          expect(';');
          return { k: 'assign', name: t.v, op: nx.v, e, line: t.line };
        }
        fail(t.line, "Mit '" + t.v + "' kann der Compiler hier nichts anfangen. Meinst du einen Methodenaufruf wie " + t.v + "(); ?");
      }
      fail(t.line, t.t === 'eof' ? EOFMSG : "Unerwartetes Zeichen '" + t.v + "' (illegal start of expression)");
    }

    function callExpr() {
      const t = cur(); p++; expect('(');
      const args = [];
      if (!isOp(')')) { for (;;) { args.push(expr()); if (isOp(',')) { p++; continue; } break; } }
      expect(')');
      return { k: 'call', name: t.v, args, line: t.line };
    }

    function bin(next, ops) {
      return function () {
        let l = next();
        while (cur().t === 'op' && ops.includes(cur().v)) {
          const o = cur(); p++; const r = next();
          l = { k: 'bin', op: o.v, l, r, line: o.line };
        }
        return l;
      };
    }
    function unary() {
      if (isOp('!')) { const t = cur(); p++; return { k: 'not', e: unary(), line: t.line }; }
      if (isOp('-')) { const t = cur(); p++; return { k: 'neg', e: unary(), line: t.line }; }
      return primary();
    }
    function primary() {
      const t = cur();
      if (t.t === 'num') { p++; return { k: 'num', v: t.v, line: t.line }; }
      if (t.t === 'str') { p++; return { k: 'str', v: t.v, line: t.line }; }
      if (t.t === 'id') {
        if (t.v === 'true' || t.v === 'false') { p++; return { k: 'bool', v: t.v === 'true', line: t.line }; }
        if (toks[p + 1].t === 'op' && toks[p + 1].v === '(') return callExpr();
        p++; return { k: 'var', name: t.v, line: t.line };
      }
      if (isOp('(')) { p++; const e = expr(); expect(')'); return e; }
      if (t.t === 'eof') fail(t.line, EOFMSG);
      fail(t.line, "Hier wird ein Wert oder eine Bedingung erwartet, nicht '" + t.v + "'");
    }
    const mul = bin(unary, ['*', '/', '%']);
    const add = bin(mul, ['+', '-']);
    const rel = bin(add, ['<', '>', '<=', '>=']);
    const eq = bin(rel, ['==', '!=']);
    const and = bin(eq, ['&&']);
    const expr = bin(and, ['||']);

    function methodDef() {
      const first = cur();
      if (isId('public')) p++;
      if (!(isId('void') || isId('int') || isId('String') || isId('boolean'))) fail(cur().line, "Methodenkopf erwartet, z. B. public void meineMethode() oder public int zaehle() (hier steht '" + cur().v + "')");
      const ret = cur().v; p++;
      const nm = expectId('Name der Methode');
      expect('(');
      const params = [];
      if (!isOp(')')) {
        for (;;) {
          const ty = cur();
          if (!(ty.t === 'id' && (ty.v === 'int' || ty.v === 'String' || ty.v === 'boolean'))) fail(ty.line, 'Vor dem Namen des Parameters fehlt der Datentyp (int, boolean oder String)');
          p++; const pn = expectId('Name des Parameters');
          params.push({ type: ty.v, name: pn.v });
          if (isOp(',')) { p++; continue; }
          break;
        }
      }
      expect(')');
      const body = block();
      return { name: nm.v, params, body, ret, line: first.line };
    }

    return {
      program() {
        const methods = [];
        while (cur().t !== 'eof') {
          if (isOp('}')) fail(cur().line, "Dieses } hat keine passende öffnende Klammer { (class, interface, or enum expected)");
          methods.push(methodDef());
        }
        validate(methods);
        return { methods };
      },
      expression() {
        const e = expr();
        if (cur().t !== 'eof') fail(cur().line, "Unerwartetes '" + cur().v + "'");
        return e;
      }
    };
  }

  function walk(n, f) {
    if (Array.isArray(n)) n.forEach(x => walk(x, f));
    else if (n && typeof n === 'object') {
      if (n.k) f(n);
      for (const key in n) if (key !== 'line') walk(n[key], f);
    }
  }

  /* Kann die Anweisung "normal" zu Ende laufen? (false = endet immer mit return). Meldet unerreichbaren Code. */
  function flow(s) {
    switch (s.k) {
      case 'return': return false;
      case 'block': {
        let ok = true;
        for (const x of s.body) {
          if (!ok) throw new JErr(x.line, 'unreachable statement: Diese Anweisung steht hinter einem return und wird nie ausgeführt');
          ok = flow(x);
        }
        return ok;
      }
      case 'if': { const a = flow(s.th); const b = s.el ? flow(s.el) : true; return a || b; }
      case 'while': flow(s.body); return !(s.c.k === 'bool' && s.c.v === true);
      case 'for': flow(s.body); return true;
      default: return true;
    }
  }

  function validate(methods) {
    const names = new Map();
    for (const m of methods) {
      if (isBuiltin(m.name)) throw new JErr(m.line, 'Die Methode ' + m.name + '() gibt es schon beim Rover, wähle einen anderen Namen');
      if (names.has(m.name)) throw new JErr(m.line, 'Die Methode ' + m.name + ' ist doppelt definiert (already defined)');
      names.set(m.name, m);
    }
    for (const m of methods) {
      walk(m.body, n => {
        if (n.k !== 'return') return;
        if (m.ret === 'void' && n.e) throw new JErr(n.line, 'In einer void-Methode darf return keinen Wert haben (incompatible types: unexpected return value). Soll die Methode einen Wert liefern, schreibe den Rückgabetyp (int, boolean, String) statt void.');
        if (m.ret !== 'void' && !n.e) throw new JErr(n.line, 'Hier fehlt hinter return der Wert, den die Methode ' + m.name + '() zurückgeben soll (missing return value)');
      });
      const completes = flow(m.body);
      if (m.ret !== 'void' && completes) throw new JErr(m.body.endLine, 'missing return statement: Die Methode ' + m.name + '() hat den Rückgabetyp ' + m.ret + ', aber nicht jeder Weg endet mit return');
    }
    for (const m of methods) {
      walk(m.body, n => {
        if (n.k !== 'call') return;
        const want = isBuiltin(n.name) ? (n.name in AUFTRAEGE ? AUFTRAEGE[n.name] : ANFRAGEN[n.name])
          : names.has(n.name) ? names.get(n.name).params.length : -1;
        if (want < 0) throw new JErr(n.line, "cannot find symbol: Die Methode '" + n.name + "' gibt es nicht. Prüfe Schreibweise und Groß-/Kleinschreibung");
        if (n.args.length !== want) {
          throw new JErr(n.line, n.name + '() braucht ' + (want === 0 ? 'keine Argumente' : want === 1 ? 'genau ein Argument' : want + ' Argumente') + ', du übergibst ' + n.args.length + ' (method cannot be applied to given types)');
        }
      });
    }
  }

  function parse(src) { return makeParser(src).program(); }

  /* ---------- Welt ---------- */
  const key = (x, y) => x + ',' + y;
  function makeWorld(s) {
    return {
      w: s.w, h: s.h,
      hills: new Set((s.hills || []).map(([x, y]) => key(x, y))),
      rocks: (s.rocks || []).map(([x, y]) => ({ x, y, analyzed: false })),
      marks: new Set((s.marks || []).map(([x, y]) => key(x, y))),
      rover: { x: s.rover.x, y: s.rover.y, dir: s.rover.dir || 0 }
    };
  }
  function cloneWorld(w) {
    return {
      w: w.w, h: w.h, hills: new Set(w.hills),
      rocks: w.rocks.map(r => ({ ...r })), marks: new Set(w.marks),
      rover: { ...w.rover }
    };
  }
  function snap(w, label, line) {
    return {
      rover: { ...w.rover }, marks: [...w.marks].map(s => s.split(',').map(Number)),
      analyzed: w.rocks.map(r => r.analyzed), label, line
    };
  }

  /* ---------- Interpreter ---------- */
  class Scope {
    constructor(parent) { this.vars = new Map(); this.parent = parent; }
    find(n) { for (let s = this; s; s = s.parent) if (s.vars.has(n)) return s; return null; }
  }
  const tname = v => (typeof v === 'number' ? 'int' : typeof v === 'string' ? 'String' : 'boolean');

  function makeCtx(ast, worldSpec, opts) {
    opts = opts || {};
    const maxActions = opts.maxActions || 500;
    const w = cloneWorld(worldSpec);
    const frames = [snap(w, 'Start', 0)];
    const mm = new Map(ast.methods.map(m => [m.name, m]));
    let steps = 0, actions = 0, depth = 0;

    const blocked = (x, y) => x < 0 || y < 0 || x >= w.w || y >= w.h || w.hills.has(key(x, y));
    const act = (label, line) => {
      if (++actions > maxActions) throw new JErr(line, 'Abbruch nach ' + maxActions + ' Aktionen: Läuft das Programm endlos?');
      frames.push(snap(w, label, line));
    };
    const dirIdx = side => ({ vorne: w.rover.dir, rechts: (w.rover.dir + 1) % 4, links: (w.rover.dir + 3) % 4 }[side]);

    const builtins = {
      fahre(a, line) {
        const [dx, dy] = DIRS[w.rover.dir]; const nx = w.rover.x + dx, ny = w.rover.y + dy;
        if (blocked(nx, ny)) {
          const edge = nx < 0 || ny < 0 || nx >= w.w || ny >= w.h;
          throw new JErr(line, edge ? 'Der Rover kann nicht fahren: Vor ihm ist der Rand der Welt.' : 'Der Rover kann nicht fahren: Vor ihm liegt ein Hügel.');
        }
        w.rover.x = nx; w.rover.y = ny; act('fahre()', line);
      },
      drehe(a, line) {
        const s = a[0];
        if (s !== 'rechts' && s !== 'links') throw new JErr(line, 'drehe() erwartet "rechts" oder "links", nicht "' + s + '"');
        w.rover.dir = (w.rover.dir + (s === 'rechts' ? 1 : 3)) % 4; act('drehe("' + s + '")', line);
      },
      setzeMarke(a, line) { w.marks.add(key(w.rover.x, w.rover.y)); act('setzeMarke()', line); },
      entferneMarke(a, line) { w.marks.delete(key(w.rover.x, w.rover.y)); act('entferneMarke()', line); },
      analysiereGestein(a, line) {
        const r = w.rocks.find(r => r.x === w.rover.x && r.y === w.rover.y);
        if (!r) throw new JErr(line, 'Hier liegt kein Gestein, analysiereGestein() geht nur auf einem Feld mit Gestein.');

      },
      gesteinVorhanden() { return w.rocks.some(r => r.x === w.rover.x && r.y === w.rover.y); },
      markeVorhanden() { return w.marks.has(key(w.rover.x, w.rover.y)); },
      huegelVorhanden(a, line) {
        const s = a[0];
        if (s !== 'vorne' && s !== 'links' && s !== 'rechts') throw new JErr(line, 'huegelVorhanden() erwartet "vorne", "links" oder "rechts", nicht "' + s + '"');
        const [dx, dy] = DIRS[dirIdx(s)]; return blocked(w.rover.x + dx, w.rover.y + dy);
      }
    };
    const PTYPES = { drehe: ['String'], huegelVorhanden: ['String'] };

    function call(e, env, needValue) {
      const args = e.args.map(a => ev(a, env));
      if (isBuiltin(e.name)) {
        const pt = PTYPES[e.name];
        if (pt) args.forEach((v, i) => {
          if (tname(v) !== pt[i]) throw new JErr(e.line, e.name + '() erwartet einen Text in Anführungszeichen, du übergibst ' + tname(v) + ' (incompatible types)');
        });

        if (needValue && !isQ) throw new JErr(e.line, e.name + '() ist ein Auftrag und liefert keinen Wert, hier wird aber wahr/falsch gebraucht');
        const r = builtins[e.name](args, e.line);
        return r;
      }
      const m = mm.get(e.name);
      if (needValue && m.ret === 'void') throw new JErr(e.line, e.name + '() ist void und liefert keinen Wert, hier wird aber ein Wert gebraucht (incompatible types)');
      m.params.forEach((pa, i) => {
        if (tname(args[i]) !== pa.type) {
          throw new JErr(e.line, 'Beim Aufruf ' + e.name + '(…) ist der Parameter ' + pa.name + ' vom Typ ' + pa.type + ', übergeben wurde aber ' + tname(args[i]) + ' (incompatible types)');
        }
      });
      if (++depth > 100) throw new JErr(e.line, 'Zu viele ineinander verschachtelte Aufrufe: Ruft sich eine Methode ohne Abbruchbedingung selbst auf? (StackOverflowError)');
      const sc = new Scope(null);
      m.params.forEach((pa, i) => sc.vars.set(pa.name, args[i]));
      const r = exec(m.body, sc);
      depth--;
      if (m.ret === 'void') return undefined;
      if (!r) throw new JErr(m.body.endLine, 'missing return statement');
      if (tname(r.v) !== m.ret) throw new JErr(r.line, 'return liefert ein ' + tname(r.v) + ', die Methode ' + m.name + '() soll aber ein ' + m.ret + ' zurückgeben (incompatible types)');
      return r.v;
    }

    function ev(e, env) {
      switch (e.k) {
        case 'num': case 'str': case 'bool': return e.v;
        case 'var': {
          const s = env.find(e.name);
          if (!s) {
            const hint = isBuiltin(e.name) || mm.has(e.name) ? ' Meinst du den Aufruf ' + e.name + '() mit Klammern?' : '';
            throw new JErr(e.line, "cannot find symbol: Die Variable '" + e.name + "' gibt es hier nicht." + hint);
          }
          return s.vars.get(e.name);
        }
        case 'call': return call(e, env, true);
        case 'not': {
          const v = ev(e.e, env);
          if (typeof v !== 'boolean') throw new JErr(e.line, 'Das Ausrufezeichen ! passt nur zu wahr/falsch, nicht zu ' + tname(v));
          return !v;
        }
        case 'neg': { const v = ev(e.e, env); if (typeof v !== 'number') throw new JErr(e.line, 'Minus passt nur zu Zahlen'); return -v; }
        case 'bin': {
          if (e.op === '&&' || e.op === '||') {
            const l = ev(e.l, env);
            if (typeof l !== 'boolean') throw new JErr(e.line, e.op + ' verknüpft nur wahr/falsch-Werte, links steht ' + tname(l));
            if (e.op === '&&' && !l) return false;
            if (e.op === '||' && l) return true;
            const r = ev(e.r, env);
            if (typeof r !== 'boolean') throw new JErr(e.line, e.op + ' verknüpft nur wahr/falsch-Werte, rechts steht ' + tname(r));
            return r;
          }
          const l = ev(e.l, env), r = ev(e.r, env);
          if (e.op === '+' && (typeof l === 'string' || typeof r === 'string')) return String(l) + String(r);
          if (e.op === '==' || e.op === '!=') { const same = l === r; return e.op === '==' ? same : !same; }
          if (typeof l !== 'number' || typeof r !== 'number') throw new JErr(e.line, 'Der Operator ' + e.op + ' passt nur zu Zahlen (bad operand types)');
          switch (e.op) {
            case '+': return l + r; case '-': return l - r; case '*': return l * r;
            case '/': if (r === 0) throw new JErr(e.line, 'Division durch 0'); return Math.trunc(l / r);
            case '%': if (r === 0) throw new JErr(e.line, 'Division durch 0'); return l % r;
            case '<': return l < r; case '>': return l > r; case '<=': return l <= r; case '>=': return l >= r;
          }
        }
      }
      throw new JErr(e.line, 'Ausdruck nicht auswertbar');
    }

    function cond(c, env) {
      const v = ev(c, env);
      if (typeof v !== 'boolean') throw new JErr(c.line, 'Die Bedingung muss wahr oder falsch ergeben (boolean), nicht ' + tname(v) + ' (incompatible types)');
      return v;
    }

    function assign(s, env) {
      const sc = env.find(s.name);
      if (!sc) throw new JErr(s.line, "cannot find symbol: Die Variable '" + s.name + "' wurde nicht deklariert");
      const cur = sc.vars.get(s.name);
      if (s.op === '=') {
        const v = ev(s.e, env);
        if (tname(v) !== tname(cur)) throw new JErr(s.line, 'Der Variablen ' + s.name + ' (' + tname(cur) + ') kann kein ' + tname(v) + ' zugewiesen werden (incompatible types)');
        sc.vars.set(s.name, v); return;
      }
      if (typeof cur !== 'number') throw new JErr(s.line, s.op + ' passt nur zu Zahlen');
      const d = s.e ? ev(s.e, env) : 1;
      sc.vars.set(s.name, s.op === '+=' || s.op === '++' ? cur + d : cur - d);
    }

    function exec(s, env) {
      if (++steps > 60000) throw new JErr(s.line, 'Abbruch: Das Programm läuft zu lange. Gibt es eine Endlosschleife?');
      switch (s.k) {
        case 'block': { const sc = new Scope(env); for (const x of s.body) { const r = exec(x, sc); if (r) return r; } return; }
        case 'expr': call(s.e, env, false); return;
        case 'return': return { v: s.e ? ev(s.e, env) : undefined, line: s.line };
        case 'if': if (cond(s.c, env)) return exec(s.th, env); else if (s.el) return exec(s.el, env); return;
        case 'while': while (cond(s.c, env)) { if (++steps > 60000) throw new JErr(s.line, 'Abbruch: Endlosschleife?'); const r = exec(s.body, env); if (r) return r; } return;
        case 'for': {
          const sc = new Scope(env);
          const v = ev(s.init, env);
          if (typeof v !== 'number') throw new JErr(s.line, 'Die Zählvariable ' + s.name + ' ist ein int und braucht eine Zahl');
          if (env.find(s.name)) throw new JErr(s.line, 'Die Variable ' + s.name + ' ist schon definiert (already defined)');
          sc.vars.set(s.name, v);
          while (cond(s.c, sc)) {
            if (++steps > 60000) throw new JErr(s.line, 'Abbruch: Endlosschleife?');
            const r = exec(s.body, sc); if (r) return r;
            assign(s.upd, sc);
          }
          return;
        }
        case 'decl': {
          if (env.find(s.name)) throw new JErr(s.line, 'Die Variable ' + s.name + ' ist schon definiert (already defined)');
          let v = s.type === 'int' ? 0 : s.type === 'boolean' ? false : '';
          if (s.e) { v = ev(s.e, env); if (tname(v) !== s.type) throw new JErr(s.line, 'Ein ' + tname(v) + ' passt nicht in eine Variable vom Typ ' + s.type + ' (incompatible types)'); }
          env.vars.set(s.name, v); return;
        }
        case 'assign': assign(s, env); return;
      }
    }
    return { w, frames, ev, exec, mm, call, Scope, snap: () => snap(w, '', 0) };
  }

  function run(ast, worldSpec, opts) {
    const ctx = makeCtx(ast, worldSpec, opts);
    let error = null;
    try {
      if (!ctx.mm.has('act')) throw new JErr(1, 'Es gibt keine Methode public void act() – ohne sie startet der Rover nicht.');
      if (ctx.mm.get('act').params.length) throw new JErr(ctx.mm.get('act').line, 'act() darf keine Parameter haben');
      ctx.call({ k: 'call', name: 'act', args: [], line: 1 }, new ctx.Scope(null), false);
    } catch (e) {
      if (e instanceof JErr) error = { line: e.line, msg: e.message }; else throw e;
    }
    return { frames: ctx.frames, error, world: ctx.w };
  }

  /* Einzelne Methode mit Argumenten aufrufen (Testfall). Gibt Rueckgabewert, Welt und Frames zurueck. */
  function runCall(src, worldSpec, name, args, opts) {
    if (!(worldSpec.hills instanceof Set)) worldSpec = makeWorld(worldSpec);
    let ast;
    try { ast = parse(src); } catch (e) {
      if (e instanceof JErr) return { error: { line: e.line, msg: e.message }, syntax: true, value: undefined, frames: [], world: cloneWorld(worldSpec) };
      throw e;
    }
    const ctx = makeCtx(ast, worldSpec, opts);
    let error = null, value;
    try {
      if (!ctx.mm.has(name)) throw new JErr(1, 'Die Methode ' + name + ' fehlt (cannot find symbol)');
      const m = ctx.mm.get(name);
      if (m.params.length !== args.length) throw new JErr(m.line, name + '() hat ' + m.params.length + ' Parameter, erwartet werden ' + args.length);
      const lit = args.map(a => typeof a === 'number' ? { k: 'num', v: a, line: 1 } : typeof a === 'boolean' ? { k: 'bool', v: a, line: 1 } : { k: 'str', v: a, line: 1 });
      value = ctx.call({ k: 'call', name, args: lit, line: m.line }, new ctx.Scope(null), false);
    } catch (e) { if (e instanceof JErr) error = { line: e.line, msg: e.message }; else throw e; }

  }

  function evalCondition(src, worldSpec) {
    const ctx = makeCtx({ methods: [] }, worldSpec);
    const e = makeParser(src).expression();
    return ctx.ev(e, new ctx.Scope(null));
  }

  function runSource(src, worldSpec, opts) {
    let ast;
    try { ast = parse(src); } catch (e) {
      if (e instanceof JErr) return { frames: [snap(cloneWorld(worldSpec), 'Start', 0)], error: { line: e.line, msg: e.message }, world: cloneWorld(worldSpec), ast: null, syntax: true };
      throw e;
    }
    const r = run(ast, worldSpec, opts); r.ast = ast; return r;
  }

  root.RoverInterp = { parse, run, runSource, runCall, evalCondition, makeWorld, walk, JErr, DIRS };
  if (typeof module !== 'undefined') module.exports = root.RoverInterp;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* Labor-Aufgaben: Parameter und Rueckgabe (Marsrover, EF.1). Gemeinsam genutzt von Seite, Tests und Word-Export. */
(function (root) {

  const fmt = v => (v === undefined ? 'nichts (void)' : typeof v === 'string' ? '"' + v + '"' : String(v));
  const callText = (L, c) => L.method + '(' + c.args.map(a => (typeof a === 'string' ? '"' + a + '"' : String(a))).join(', ') + ')';
  const row = (name, hills, rocks, marks, extra = {}) => ({
    name, spec: { w: 10, h: 3, rover: { x: 0, y: 1, dir: 0 }, hills: [[9, 1], ...hills], rocks: rocks || [], marks: marks || [], ...extra }
  });
  const posMsg = (r, x, y) => 'Der Rover steht bei Spalte ' + r.rover.x + ', Zeile ' + r.rover.y + ' – erwartet wird Spalte ' + x + ', Zeile ' + y + '.';
  const sameMarks = (got, want) => {

  const hasMethod = (ast, f) => ast.methods.some(m => m.name !== 'act' && f(m));
  const callsInside = (ast, name) => {

  };

  const LAB = [

    {
      id: 'p1', concept: 'Parameter', title: 'Wege mit Knicken', hour: 1, level: 'Basis',
      task: 'Drei Proben liegen auf einem Weg mit Knicken. Schreibe den Rumpf der Methode fahreSchritte(int pAnzahl) und rufe sie in act() mehrfach mit unterschiedlichen Werten auf. Analysiere alle Steine.',
      worlds: [{ name: 'Welt', spec: { w: 9, h: 6, rover: { x: 0, y: 0, dir: 0 }, rocks: [[3, 0], [3, 4], [7, 4]], hills: [[5, 1], [6, 3], [1, 3]] } }],
      starter: 'public void fahreSchritte(int pAnzahl)\n{\n    // hier fehlt der Rumpf\n}\n\npublic void act()\n{\n    \n}\n',
      require: (ast) => {

        const calls = [];

    function clearSel() { if (sel) { lookup(sel.side, sel.i).classList.remove('sel'); sel = null; } }

          sel = null; solved++; solvedIdx.push(li); recM();
          if (solved === pairs.length) { c.say(errs ? 'Alles zugeordnet, mit ' + errs + ' Fehlversuch(en).' : 'Alles zugeordnet, ohne Fehlversuch!', 'ok'); c.done(); } else c.say(solved + ' von ' + pairs.length + ' zugeordnet.', 'info');
        } else {

  }

  /* ---------- Gruppenzuordnung ---------- */
  function buildSort(cfg) {
    let cards = cfg.cards;
    if (cfg.exprs) cards = cfg.exprs.map(e => ({ t: e, c: RI.evalCondition(e, RI.makeWorld(cfg.world)) ? 0 : 1 }));
    const items = shuffle(cards.map((k, i) => ({ ...k, id: i, place: -1, st: null })));
    let selId = null;
    const pool = h('div', { class: 'pool' });
    const bks = cfg.buckets.map(b => ({ box: h('div', { class: 'bucket' }) }));
    function put(id, place) { const it = items.find(x => x.id === id); it.place = place; it.st = null; }
    function render() {
      pool.innerHTML = ''; bks.forEach(b => { b.box.innerHTML = ''; });
      items.forEach(it => {
        const b = h('button', {
          class: 'card' + (selId === it.id ? ' sel' : '') + (it.st ? ' ' + it.st : ''), type: 'button', draggable: 'true',
          ondragstart: e => { e.dataTransfer.setData('text/plain', String(it.id)); },
          onclick: e => {
            e.stopPropagation();
            if (selId != null && selId !== it.id && it.place >= 0) { put(selId, it.place); selId = null; } else selId = selId === it.id ? null : it.id;
            render();
          }
        }, it.t);
        (it.place < 0 ? pool : bks[it.place].box).append(b);
      });
    }
    const wire = (el, place) => {
      el.addEventListener('click', () => { if (selId != null) { put(selId, place); selId = null; render(); } });
      el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('hover'); });
      el.addEventListener('dragleave', () => el.classList.remove('hover'));
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('hover'); const id = +e.dataTransfer.getData('text/plain'); if (!isNaN(id)) { put(id, place); selId = null; render(); } });
    };
    wire(pool, -1);
    const wraps = cfg.buckets.map((b, i) => {
      const w = h('div', { class: 'bwrap' }, h('h4', {}, b.t, h('small', {}, b.s)), bks[i].box);
      wire(w, i); return w;
    });
    const body = [];
    if (cfg.world) { const v = new WorldView(cfg.world); body.push(h('div', { style: 'max-width:420px;margin-bottom:12px' }, v.svg)); }
    body.push(pool, h('div', { class: 'buckets' }, wraps));
    const btn = h('button', {
      class: 'btn', type: 'button', onclick: () => {
        const placed = items.filter(i => i.place >= 0);
        if (!placed.length) { c.say('Sortiere zuerst Karten in die Felder ein.', 'info'); return; }
        placed.forEach(i => { i.st = i.place === i.c ? 'right' : 'wrong'; });
        const wrong = placed.filter(i => i.st === 'wrong').length, left = items.filter(i => i.place < 0).length;
        c.res({ sum: (placed.length - wrong) + ' von ' + items.length + ' Karten richtig einsortiert' + (wrong ? ', ' + wrong + ' lagen falsch' : ''), lines: cfg.buckets.map((b, bi) => b.t + ': ' + (items.filter(i => i.place === bi && i.st === 'right').map(i => i.t).join('   |   ') || '-')) });
        render();
        if (wrong) {
          c.say(wrong + ' Karte(n) liegen falsch und springen zurück.', 'bad');
          setTimeout(() => { items.forEach(i => { if (i.st === 'wrong') { i.place = -1; i.st = null; } }); render(); }, 1300);
        } else if (left) c.say('Bisher alles richtig. Noch ' + left + ' Karte(n) übrig.', 'info');
        else { c.say('Alles richtig sortiert!', 'ok'); c.done(); }
      }
    }, 'Prüfen');
    const c = card(cfg, 'Gruppenzuordnung', body, [btn]);
    render();
    return c.el;
  }

  /* ---------- Lückentext ---------- */
  function gapSplit(src) {
    const parts = [], re = /\[\[(.+?)\]\]/g; let last = 0, m;
    while ((m = re.exec(src))) { parts.push({ t: src.slice(last, m.index) }); parts.push({ gap: m[1].split('~~') }); last = re.lastIndex; }
    parts.push({ t: src.slice(last) });
    return parts;
  }
  function buildGaps(cfg) {
    const inputs = [];
    const mkInput = (answers, isCode) => {
      const longest = Math.max(...answers.map(a => a.length));
      const inp = h('input', { class: 'gap', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Lücke ' + (inputs.length + 1), style: 'width:' + Math.max(4, longest + 2.5) + 'ch' });
      inp.addEventListener('input', () => { inp.classList.remove('ok', 'bad', 'shown'); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      inputs.push({ el: inp, answers, isCode });
      return inp;
    };
    const body = cfg.blocks.map(b => {
      if (b.code) {
        const box = h('div', { class: 'codebox' });
        for (const p of gapSplit(b.code)) { if (p.gap) box.append(mkInput(p.gap, true)); else { const s = h('span'); s.innerHTML = hl(p.t); box.append(s); } }
        return box;
      }
      const para = h('p');
      for (const p of gapSplit(b.p)) { if (p.gap) para.append(mkInput(p.gap, false)); else { const s = h('span'); s.innerHTML = md(p.t); para.append(s); } }
      return para;
    });
    const norm = (s, code) => { const t = s.replace(/\s+/g, ''); return code ? t : t.toLowerCase(); };
    let checked = 0;
    function recG(okN) {
      c.res({ sum: okN + ' von ' + inputs.length + ' Lücken richtig' + (checked > 1 ? ' (Prüfung Nr. ' + checked + ')' : ''), lines: inputs.map((g, i) => {
        const v = g.el.value.trim(), shown = g.el.classList.contains('shown'), good = g.el.classList.contains('ok');
        return 'Lücke ' + (i + 1) + ': ' + (v ? '"' + v + '"' : '(leer)') + (shown ? ' – Lösung angezeigt' : good ? ' – richtig' : ' – falsch, richtig wäre: ' + g.answers[0]);
      }) });
    }
    function check() {
      checked++;
      let ok = 0;
      inputs.forEach(g => {
        const good = g.el.value.trim() !== '' && g.answers.some(a => norm(a, g.isCode) === norm(g.el.value, g.isCode));
        g.el.classList.toggle('ok', good); g.el.classList.toggle('bad', !good); if (good) ok++;
      });
      recG(ok);
      if (ok === inputs.length) { c.say('Alle ' + ok + ' Lücken stimmen!', 'ok'); c.done(); sol.disabled = true; }
      else { c.say(ok + ' von ' + inputs.length + ' Lücken stimmen. Rot markierte noch einmal prüfen.', 'bad'); sol.disabled = false; }
    }
    const sol = h('button', {
      class: 'btn ghost', type: 'button', disabled: true, onclick: () => {
        inputs.forEach(g => { if (!g.el.classList.contains('ok')) { g.el.value = g.answers[0]; g.el.classList.remove('bad'); g.el.classList.add('shown'); } });
        recG(inputs.filter(g => g.el.classList.contains('ok')).length);
        c.say('Lösung eingetragen. Zählt erst, wenn du es selbst richtig hast.', 'info');
      }
    }, 'Lösung zeigen');
    const c = card(cfg, 'Lückentext', [h('div', { class: 'gaptext' }, body)], [h('button', { class: 'btn', type: 'button', onclick: check }, 'Prüfen'), sol]);
    return c.el;
  }

  /* ---------- Reihenfolge ---------- */

          h('button', { class: 'mvb', type: 'button', 'aria-label': 'Nach oben', disabled: pos === 0, onclick: () => { [ord[pos - 1], ord[pos]] = [ord[pos], ord[pos - 1]]; marks = []; render(); } }, '▲'),
          h('button', { class: 'mvb', type: 'button', 'aria-label': 'Nach unten', disabled: pos === n - 1, onclick: () => { [ord[pos + 1], ord[pos]] = [ord[pos], ord[pos + 1]]; marks = []; render(); } }, '▼'));

  /* ---------- Quiz ---------- */
  function buildQuiz(cfg) {
    const nQ = cfg.qs.length, opts = cfg.qs.map(q => shuffle(q.opts));

    const root = h('div');
    function recQ() {

      c.res({ sum: got.filter(x => x.ok).length + ' von ' + nQ + ' Fragen im ersten Versuch richtig' + (got.length < nQ ? ' (' + got.length + ' beantwortet)' : ''),
        lines: qlog.map((x, i) => (x ? 'Frage ' + (i + 1) + ': ' + x.q.replace(/`/g, '') + '  Antwort: "' + x.a + '" – ' + (x.ok ? 'richtig' : 'falsch, richtig wäre: "' + x.right + '"') : null)).filter(Boolean) });
    }
    function show() {
      root.innerHTML = ''; answered = false;

        root.append(h('div', { class: 'q' }, good + ' von ' + nQ + ' im ersten Versuch richtig.'),
          h('p', {}, passed ? 'Stark! Das Thema sitzt.' : 'Noch nicht ganz. Lies die Erklärungen noch einmal und versuche es erneut.'),
          h('button', { class: 'btn ghost', type: 'button', onclick: () => { qi = 0; results = []; qlog = []; c.say(''); show(); } }, 'Nochmal spielen'));
        if (passed) { c.say('Quiz geschafft.', 'ok'); c.done(); } else c.say('Für „geschafft“ brauchst du mindestens ' + need + ' richtige.', 'bad');

      const qEl = h('div', { class: 'q' }); qEl.innerHTML = md(q.q); root.append(qEl);
      if (q.code) root.append(codeBlock(q.code));

      opts[qi].forEach(o => {

        b.innerHTML = /\(.*\)/.test(o.t) && !/[äöüÄÖÜß]/.test(o.t) && !/\b(der|die|das|und|ein|eine|ist|nur|kein|keine|nicht|Fehler|wenn|bei)\b/i.test(o.t) ? '<code>' + esc(o.t) + '</code>' : md(o.t);
        b.addEventListener('click', () => {
          if (answered) return; answered = true;

          if (!o.ok) [...box.children].forEach((x, i) => { if (opts[qi][i].ok) x.classList.add('ok'); });

  /* ---------- Wahrheitstabelle ---------- */

  /* ---------- Fehlersuche ---------- */

  /* ---------- Spurensuche ---------- */
  function buildTrace(cfg) {
    function rec() {
      const sv = cases.filter(k => k.solved).length, wr = cases.reduce((n, k) => n + k.wrong, 0);

    }
    const cases = cfg.cases.map((cs, i) => {
      const run = RI.runSource(cfg.code, RI.makeWorld(cs.world));
      const o = { cs, expect: run.world.rover, frames: run.frames, solved: false, wrong: 0, stop: null };
      const view = new WorldView(cs.world, {
        clickable: true,
        onCell: (x, y, v) => {
          if (o.solved) return;

            o.solved = true; rec(); v.highlight([{ x, y, ok: true }]); msg.textContent = 'Richtig! Der Rover steht dort. Sieh dir den Ablauf an, wenn du magst.'; msg.className = 'fb ok'; playBtn.hidden = false;

          } else {

            msg.textContent = o.wrong >= 2 ? 'Noch nicht. Spiele den Ablauf ab und vergleiche.' : 'Das ist es nicht. Verfolge den Code Zeile für Zeile.';

      const playBtn = h('button', {
        class: 'btn ghost', type: 'button', hidden: true, style: 'margin-top:8px', onclick: () => {
          if (o.stop) o.stop();
          view.highlight([]);

        }

  /* ---------- Rover-Labor (Programm-Aufgaben und Methoden-Tests) ---------- */
  function buildLab(act) {
    const L = act.lab; let runs = [], results = [], cur = 0, stop = null, fails = 0, hintN = 0, reqMsg = null, escTrap = false, runCount = 0;
    const views = L.worlds.map(w => new WorldView(w.spec));
    const ta = h('textarea', { spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', 'aria-label': 'Programmcode für ' + L.title });
    ta.value = state.code[L.id] || L.starter;
    const gutter = h('div', { class: 'gutter', 'aria-hidden': 'true' });
    const lineCount = () => ta.value.split('\n').length;
    function paintGutter(errLine, runLine) {
      gutter.innerHTML = '';
      for (let i = 1; i <= lineCount(); i++) gutter.append(h('div', { class: i === errLine ? 'err' : i === runLine ? 'run' : '' }, String(i)));
      gutter.scrollTop = ta.scrollTop;
    }
    let saveT = null;
    ta.addEventListener('input', () => { paintGutter(); clearTimeout(saveT); saveT = setTimeout(() => { state.code[L.id] = ta.value; save(); }, 400); });
    ta.addEventListener('scroll', () => { gutter.scrollTop = ta.scrollTop; });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Escape') { escTrap = true; return; }
      if (e.key === 'Tab' && !escTrap && !e.shiftKey) {

        const fname = 'Marsrover-Parameter_' + (slug(meta.name) || 'Ergebnisse') + '_' + (meta.datum || todayISO()) + '.pdf';
        const r = await deliver(doc.output('blob'), fname);
        if (r === 'saved') { pdfSay.className = 'fb ok'; pdfSay.textContent = 'PDF gespeichert: ' + fname; }
        else { pdfSay.className = 'fb info'; pdfSay.textContent = 'Speichern abgebrochen. Du kannst es jederzeit noch einmal versuchen.'; }
      } catch (e) { pdfSay.className = 'fb bad'; pdfSay.textContent = 'Das PDF konnte nicht erstellt werden: ' + ((e && e.message) || e); }
      finally { pdfBtn.disabled = false; }
    }
  }, 'Als PDF speichern');
  const saveSec = h('section', { class: 'save', id: 'sichern' },
    h('div', { class: 'kicker' }, 'Zum Abgeben oder Abheften'),
    h('h2', {}, 'Ergebnisse sichern'),
    h('p', { class: 'lead' }, 'Das PDF fasst zusammen, was du geschafft hast: mit deinen eigenen Eingaben und dem Code aus dem Rover-Labor. Am Ende gibt es eine Seite für eigene Notizen. Auch angefangene Aufgaben werden festgehalten.'),
    h('div', { class: 'fields' }, mkField('f-name', 'Name', fName), mkField('f-kurs', 'Kurs / Klasse', fKurs), mkField('f-datum', 'Datum', fDatum)),
    h('div', { class: 'act-foot' }, pdfBtn, pdfSay),
    h('p', { class: 'pick' }, 'GoodNotes: PDF öffnen, Teilen, „In GoodNotes öffnen“. OneNote: Einfügen, Datei, PDF auswählen.'));

  app.append(...stationEls, finish, saveSec, foot);
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('still', !e.isIntersecting)));
    document.querySelectorAll('svg.doodle').forEach(d => { d.classList.add('still'); io.observe(d); });
  }

  function updateProgress() {
    let done = 0;
    CONTENT.STATIONS.forEach(s => {
      const d = s.acts.filter(a => state.done[a.id]).length; done += d;
      navChips[s.id].cnt.textContent = d + '/' + s.acts.length;
      navChips[s.id].a.classList.toggle('all', d === s.acts.length);
    });
    bar.style.width = (done / total * 100) + '%';
    lbl.textContent = done + ' von ' + total + ' Aufgaben geschafft';
    finish.classList.toggle('on', done === total);
    lbl2.textContent = done === total ? 'Alle ' + total + ' Aufgaben sind geschafft. Starke Leistung, du kannst Methoden mit Parametern und Rückgabe entwickeln und testen.' : 'Noch ' + (total - done) + ' Aufgabe(n) offen. Die Stationen oben führen dich direkt dorthin.';
    document.querySelector('.bar').setAttribute('aria-valuenow', Math.round(done / total * 100));
  }
  updateProgress();
})();

</script>
