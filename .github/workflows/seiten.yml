name: Seiten veröffentlichen

# Läuft bei jeder Änderung, jede Nacht kurz nach Mitternacht (deutsche Zeit) und auf Knopfdruck.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7 23 * * *"   # 00:07 Uhr MEZ / 01:07 Uhr MESZ
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Abgelaufene Seiten entfernen und Website zusammenstellen
        run: python3 tools/aufraeumen.py --loeschen --site _site

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A seiten seiten.json
          if ! git diff --cached --quiet; then
            git commit -m "Abgelaufene Seiten entfernt, Übersicht aktualisiert"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
